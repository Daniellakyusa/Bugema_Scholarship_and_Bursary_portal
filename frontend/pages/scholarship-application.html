<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scholarship Application - Bugema University</title>
    <link rel="icon" href="../images/BU logo.jpg" type="image/jpeg">
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f5f5f5;
            padding: 20px 0;
            font-size: 18px;
        }

        /* Logo Container */
        .logo-container {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px 0;
        }

        .logo {
            max-width: 120px;
            height: auto;
            border-radius: 50%;
            background: white;
            padding: -1px;
            box-shadow: 0 6px 25px rgba(30, 60, 114, 0.3);
            border: 4px solid #2c5282;
        }

        /* Form Container */
        .form-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .application-form {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .form-title {
            text-align: center;
            color: #2c5282;
            margin-bottom: 10px;
            font-size: 2.5rem;
            font-weight: 700;
        }

        .form-description {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
            font-size: 1.3rem;
        }

        /* Section Headers */
        .form-section-header {
            background: #f8f9fa;
            padding: 12px 15px;
            border-left: 4px solid #2c5282;
            margin: 30px 0 20px 0;
        }

        .form-section-header h3 {
            margin: 0;
            color: #1e3a5f;
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        /* Form Rows and Groups */
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 1.1rem;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 15px 18px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 18px;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #2c5282;
            box-shadow: 0 0 0 3px rgba(44, 82, 130, 0.1);
        }

        /* Phone Input */
        .phone-input {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .country-code {
            width: 100px !important;
            padding: 15px 12px !important;
            border: 2px solid #e9ecef !important;
            border-radius: 8px !important;
            font-size: 18px !important;
        }

        .phone-input input {
            flex: 1;
        }

        /* Radio Button Group */
        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .radio-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 0;
            font-weight: 400;
            cursor: pointer;
            font-size: 1.1rem;
        }

        .radio-group input[type="radio"] {
            width: auto;
            cursor: pointer;
        }

        /* File Input */
        .file-input-wrapper {
            position: relative;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .file-input-wrapper input[type="file"] {
            flex: 1;
            padding: 15px 18px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .btn-browse {
            padding: 12px 24px;
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            color: #333;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .btn-browse:hover {
            background: #f8f9fa;
            border-color: #2c5282;
        }

        /* Checkbox Group */
        .checkbox-group {
            margin-top: 8px;
        }

        .checkbox-group label {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            font-weight: 400;
            cursor: pointer;
            line-height: 1.5;
            font-size: 1.1rem;
        }

        .checkbox-group input[type="checkbox"] {
            width: auto;
            margin-top: 2px;
            cursor: pointer;
        }

        /* Form Actions */
        .form-actions {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid #e9ecef;
        }

        .btn {
            padding: 18px 45px;
            border: none;
            border-radius: 25px;
            font-size: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: linear-gradient(135deg, #2c5282, #3b7ba3);
            color: white;
            box-shadow: 0 4px 15px rgba(44, 82, 130, 0.2);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #1e3a5f, #2c5282);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(44, 82, 130, 0.4);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #718096, #4a5568);
            color: white;
            box-shadow: 0 4px 15px rgba(113, 128, 150, 0.2);
        }

        .btn-secondary:hover {
            background: linear-gradient(135deg, #4a5568, #2d3748);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(113, 128, 150, 0.3);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .form-container {
                padding: 0 15px;
            }

            .application-form {
                padding: 25px;
            }

            .form-title {
                font-size: 1.6rem;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .phone-input {
                flex-direction: column;
            }

            .country-code {
                width: 100% !important;
            }

            .radio-group {
                flex-direction: column;
                gap: 10px;
            }

            .form-actions {
                flex-direction: column;
                align-items: stretch;
            }

            .btn {
                width: 100%;
                text-align: center;
            }
        }

        @media (max-width: 480px) {
            .logo {
                max-width: 90px;
            }

            .application-form {
                padding: 20px;
            }

            .form-title {
                font-size: 1.4rem;
            }

            .form-description {
                font-size: 1rem;
            }
        }

        /* Focus styles for accessibility */
        button:focus,
        input:focus,
        select:focus,
        textarea:focus {
            outline: 2px solid #2c5282;
            outline-offset: 2px;
        }
    </style>
</head>
<body>
    <!-- Logo Section -->
    <div class="logo-container">
        <img src="../images/BU logo.jpg" alt="Bugema University Logo" class="logo">
    </div>
    
    <!-- Quick Links -->
    <div style="text-align: center; margin-bottom: 20px;">
        <a href="scholarship-application-minimal.html" class="dropdown-item">Scholarship</a>
    </div>

    <!-- Form Container -->
    <div class="form-container">
        <form id="scholarshipForm" class="application-form">
            <h2 class="form-title">Scholarship Application Form</h2>
            <p class="form-description">Please complete all required fields to apply for scholarship opportunities at Bugema University.</p>
            
            <!-- Personal Information Section -->
            <div class="form-section-header">
                <h3>Personal Information</h3>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="firstName">First Name *</label>
                    <input type="text" id="firstName" name="firstName" required>
                </div>
                <div class="form-group">
                    <label for="lastName">Last Name *</label>
                    <input type="text" id="lastName" name="lastName" required>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="email">Email Address *</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number *</label>
                    <div class="phone-input">
                        <input type="text" class="country-code" placeholder="+256" value="+256">
                        <input type="tel" id="phone" name="phone" placeholder="700000000" required>
                    </div>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="studentId">Student ID Number *</label>
                    <input type="text" id="studentId" name="studentId" required>
                </div>
                <div class="form-group">
                    <label for="program">Program of Study *</label>
                    <input type="text" id="program" name="program" required>
                </div>
            </div>
            
            <!-- Academic Information Section -->
            <div class="form-section-header">
                <h3>Academic Information</h3>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="year">Current Year of Study *</label>
                    <select id="year" name="year" required>
                        <option value="">Select Year</option>
                        <option value="1">Year 1</option>
                        <option value="2">Year 2</option>
                        <option value="3">Year 3</option>
                        <option value="4">Year 4</option>
                        <option value="5">Year 5</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="gpa">Current GPA *</label>
                    <input type="number" id="gpa" name="gpa" step="0.01" min="0" max="4.0" required>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Scholarship Type *</label>
                    <div class="radio-group">
                        <label>
                            <input type="radio" name="scholarshipType" value="academic" required>
                            Academic Excellence
                        </label>
                        <label>
                            <input type="radio" name="scholarshipType" value="need" required>
                            Need-Based
                        </label>
                        <label>
                            <input type="radio" name="scholarshipType" value="sports" required>
                            Sports
                        </label>
                    </div>
                </div>
                <div class="form-group">
                    <label for="essay">Personal Statement *</label>
                    <textarea id="essay" name="essay" rows="4" placeholder="Please describe why you deserve this scholarship..." required></textarea>
                </div>
            </div>
            
            <!-- Document Upload Section -->
            <div class="form-section-header">
                <h3>Required Documents</h3>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="transcript">Academic Transcript *</label>
                    <div class="file-input-wrapper">
                        <input type="file" id="transcript" name="transcript" accept=".pdf,.doc,.docx" required>
                        <button type="button" class="btn-browse">Browse</button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="recommendation">Recommendation Letter *</label>
                    <div class="file-input-wrapper">
                        <input type="file" id="recommendation" name="recommendation" accept=".pdf,.doc,.docx" required>
                        <button type="button" class="btn-browse">Browse</button>
                    </div>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="idCopy">ID Document *</label>
                    <div class="file-input-wrapper">
                        <input type="file" id="idCopy" name="idCopy" accept=".pdf,.jpg,.jpeg,.png" required>
                        <button type="button" class="btn-browse">Browse</button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="proof">Proof of Admission *</label>
                    <div class="file-input-wrapper">
                        <input type="file" id="proof" name="proof" accept=".pdf,.jpg,.jpeg,.png" required>
                        <button type="button" class="btn-browse">Browse</button>
                    </div>
                </div>
            </div>
            
            <!-- Declaration Section -->
            <div class="form-section-header">
                <h3>Declaration</h3>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <div class="checkbox-group">
                        <label>
                            <input type="checkbox" id="declaration" name="declaration" required>
                            I certify that all information provided is true and accurate. I understand that providing false information may result in disqualification.
                        </label>
                    </div>
                </div>
                <div class="form-group">
                    <div class="checkbox-group">
                        <label>
                            <input type="checkbox" id="consent" name="consent" required>
                            I consent to Bugema University processing my personal information for scholarship evaluation purposes.
                        </label>
                    </div>
                </div>
            </div>
            
            <!-- Submit Section -->
            <div class="form-actions">
                <button type="button" class="btn btn-secondary" onclick="window.history.back()">Cancel</button>
                <button type="submit" class="btn btn-primary">Submit Application</button>
            </div>
        </form>
    </div>

    <script>
        // Form submission handler
        document.getElementById('scholarshipForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Basic form validation
            const requiredFields = this.querySelectorAll('[required]');
            let isValid = true;
            
            requiredFields.forEach(field => {
                if (!field.value.trim()) {
                    field.style.borderColor = '#dc3545';
                    isValid = false;
                } else {
                    field.style.borderColor = '#e9ecef';
                }
            });
            
            if (isValid) {
                // Show success message
                alert('Scholarship application submitted successfully! We will contact you within a few days.');
                
                // Reset form
                this.reset();
            } else {
                alert('Please fill in all required fields.');
            }
        });

        // File input browse button functionality
        document.querySelectorAll('.btn-browse').forEach(button => {
            button.addEventListener('click', function() {
                const fileInput = this.previousElementSibling;
                fileInput.click();
            });
        });

        // Update file input display when file is selected
        document.querySelectorAll('input[type="file"]').forEach(input => {
            input.addEventListener('change', function() {
                if (this.files.length > 0) {
                    this.style.borderColor = '#28a745';
                }
            });
        });
    </script>
    
    <!-- Include comprehensive footer -->
    <link rel="stylesheet" href="../css/footer.css">
    <div id="footer-placeholder"></div>
    
    <script>
        // Load footer component
        fetch('../components/footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer-placeholder').innerHTML = data;
            })
            .catch(error => console.log('Footer not loaded:', error));
    </script>
</body>
</html>
