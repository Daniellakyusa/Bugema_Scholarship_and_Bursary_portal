<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Account - Bugema University</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .account-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .account-header {
            background: linear-gradient(135deg, #1e3a5f, #2c5282);
            color: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .registration-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            padding: 30px;
            margin-bottom: 30px;
            border-left: 5px solid #2c5282;
        }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e9ecef;
        }
        
        .status-badge {
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
        }
        
        .status-approved {
            background: #d4edda;
            color: #155724;
        }
        
        .status-pending {
            background: #fff3cd;
            color: #856404;
        }
        
        .status-rejected {
            background: #f8d7da;
            color: #721c24;
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .info-item {
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        
        .info-label {
            font-weight: 600;
            color: #495057;
            margin-bottom: 5px;
        }
        
        .info-value {
            color: #212529;
            font-size: 1.1rem;
        }
        
        .no-registration {
            text-align: center;
            padding: 60px 20px;
            background: #f8f9fa;
            border-radius: 12px;
            color: #6c757d;
        }
        
        .no-registration h2 {
            margin-bottom: 20px;
            color: #495057;
        }
        
        .btn-primary {
            background: #2c5282;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            transition: background 0.3s ease;
        }
        
        .btn-primary:hover {
            background: #1e3a5f;
        }
        
        .quick-actions {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        .action-btn {
            background: #17a2b8;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            transition: background 0.3s ease;
        }
        
        .action-btn:hover {
            background: #138496;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo-container">
                <img src="../images/BU%20logo.jpg" alt="BUGEMA UNIVERSITY LOGO" class="logo">
            </div>
            <div>
                <h1 class="portal-title">Student Account</h1>
                <a href="index.html" class="dropdown-item">Back to Portal</a>
            </div>
        </div>
    </header>
    
    <main class="account-container">
        <div class="account-header">
            <h2>Welcome to Your Student Account</h2>
            <p>Manage your registration and applications</p>
        </div>
        
        <div id="registrationStatus">
            <!-- Registration status will be loaded here -->
        </div>
        
        <div class="quick-actions">
            <a href="scholarship-application-minimal.html" class="action-btn">Apply for Scholarship</a>
            <a href="bursary-application.html" class="action-btn">Apply for Bursary</a>
            <a href="register.html" class="action-btn">Update Registration</a>
        </div>
    </main>
    
    <!-- Include comprehensive footer -->
    <link rel="stylesheet" href="../css/footer.css">
    <div id="footer-placeholder"></div>
    
    <script src="../js/student-account.js"></script>
    <script>
        // Load footer component
        fetch('../components/footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer-placeholder').innerHTML = data;
            })
            .catch(error => console.log('Footer not loaded:', error));
    </script>
</body>
</html>
